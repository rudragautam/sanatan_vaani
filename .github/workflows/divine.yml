name: Divine Vaani

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: "20"

  - name: Install system packages
    run: |
      sudo apt-get update
      sudo apt-get install -y ffmpeg

  - name: Install Python packages
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Install Playwright
    run: |
      npm install --no-save playwright@1.55.0
      npx playwright install --with-deps chromium

  - name: Validate story
    run: |
      python tools/validate_story.py stories/krishna-vichaar/story.json

  - name: Build visual video
    env:
      STORY_ID: krishna-vichaar
      TTS_ENABLED: "false"
      TTS_PROVIDER: aws_polly
    run: |
      python divine_main.py

  - name: Upload generated video
    uses: actions/upload-artifact@v4
    with:
      name: divine-vichaar-${{ github.run_number }}
      path: output/
      if-no-files-found: error
      retention-days: 7
```
